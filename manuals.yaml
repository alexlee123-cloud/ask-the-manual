# Manuals the assistant answers from.
#
# The PDFs themselves are copyrighted, so they are never committed. Put them in
# one local folder and point ATM_MANUALS_DIR at it in .env (default: data/manuals/).
# scripts/download_manuals.py can also fetch each `url` into data/manuals/.
#
# Fields:
#   id:       short unique name (also the file name download_manuals.py saves)
#   title:    shown in citations
#   machine:  machine family, used by the app's filter and by the eval
#   url:      official source
#   match:    words that identify this manual in a file name you downloaded by
#             hand (case-insensitive), so any file name works
manuals:
  - id: osha-3120-lockout-tagout
    title: "OSHA 3120: Control of Hazardous Energy (Lockout/Tagout)"
    machine: general-safety
    url: https://www.osha.gov/sites/default/files/publications/osha3120.pdf
    match: ["osha3120", "osha-3120", "osha 3120"]

  - id: osha-1910-147-lockout-tagout
    title: "29 CFR 1910.147: The Control of Hazardous Energy (Lockout/Tagout)"
    machine: general-safety
    url: https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-J/section-1910.147
    match: ["1910.147", "1910-147"]

  - id: haas-mill-operator
    title: "Haas Mill Operator's Manual (NGC, 2022)"
    machine: haas-mill
    url: https://www.haascnc.com/content/dam/haascnc/en/service/manual/operator/english---mill-ngc---operator%27s-manual---2022.pdf
    match: ["mill-ngc", "mill-operator", "mill operator"]

  - id: haas-lathe-operator
    title: "Haas Lathe Operator's Manual (NGC, 2023)"
    machine: haas-lathe
    url: https://www.haascnc.com/content/dam/haascnc/en/service/manual/operator/english---lathe-ngc---operator%27s-manual---2023.pdf
    match: ["lathe-ngc", "lathe-operator", "lathe operator"]
